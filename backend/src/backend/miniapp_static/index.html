<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRM Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 16px 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1 { font-size: 18px; margin: 4px 0 16px; }
  h2 { font-size: 15px; margin: 20px 0 8px; color: var(--hint); font-weight: 600; }
  select {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--secondary-bg);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 14px;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th, td { text-align: left; padding: 8px 4px; font-size: 14px; }
  th { color: var(--hint); font-weight: 500; border-bottom: 1px solid var(--secondary-bg); }
  td { border-bottom: 1px solid var(--secondary-bg); }
  .rank { color: var(--hint); width: 24px; }
  .amount { text-align: right; font-variant-numeric: tabular-nums; }
  .card {
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 4px;
  }
  .card .label { font-size: 12px; color: var(--hint); }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .empty, .error { color: var(--hint); font-size: 14px; padding: 16px 0; }
  .error { color: #c0392b; }
</style>
</head>
<body>
  <h1 id="greeting">CRM Dashboard</h1>

  <div id="summary" class="card">
    <div class="label">Компания за месяц</div>
    <div class="value" id="summary-value">—</div>
  </div>

  <div id="debug" class="card" style="font-size:11px;white-space:pre-wrap;word-break:break-all;"></div>

  <h2>Топ по компании</h2>
  <div id="company-top"><div class="empty">Загрузка…</div></div>

  <h2>Топ по команде</h2>
  <select id="team-select"><option>Загрузка…</option></select>
  <div id="team-top"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const initData = tg?.initData || "";

    document.getElementById("debug").textContent =
      `href: ${location.href}\n` +
      `window.Telegram: ${typeof window.Telegram}\n` +
      `platform: ${tg?.platform}\n` +
      `version: ${tg?.version}\n` +
      `colorScheme: ${tg?.colorScheme}\n` +
      `initData length: ${initData.length}\n` +
      `initData raw: ${initData}\n` +
      `initDataUnsafe: ${JSON.stringify(tg?.initDataUnsafe)}`;

    function firstDayOfMonth() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10);
    }
    const periodStart = firstDayOfMonth();
    const periodEnd = new Date().toISOString().slice(0, 10);

    async function api(path, params) {
      const url = new URL(path, window.location.origin);
      for (const [k, v] of Object.entries(params || {})) url.searchParams.set(k, v);
      const res = await fetch(url, { headers: { "X-Telegram-Init-Data": initData } });
      if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
      return res.json();
    }

    function renderTop(container, entries) {
      if (!entries.length) {
        container.innerHTML = '<div class="empty">Пока нет данных за период.</div>';
        return;
      }
      const rows = entries
        .map(
          (e) => `<tr>
            <td class="rank">${e.rank}</td>
            <td>${e.full_name}</td>
            <td class="amount">${e.total_amount}</td>
            <td class="amount">${e.deposit_count}</td>
          </tr>`
        )
        .join("");
      container.innerHTML = `<table>
        <tr><th></th><th>Менеджер</th><th class="amount">Сумма</th><th class="amount">Кол-во</th></tr>
        ${rows}
      </table>`;
    }

    async function loadCompanyTop() {
      const container = document.getElementById("company-top");
      const summaryValue = document.getElementById("summary-value");
      try {
        const entries = await api("/stats/top/company", { period_start: periodStart, period_end: periodEnd });
        renderTop(container, entries);
        const total = entries.reduce((sum, e) => sum + Number(e.total_amount), 0);
        summaryValue.textContent = total ? total.toLocaleString("ru-RU") : "0";
      } catch (err) {
        container.innerHTML = `<div class="error">Недоступно: ${err.message}</div>`;
        summaryValue.textContent = "—";
      }
    }

    async function loadTeams() {
      const select = document.getElementById("team-select");
      const teamTop = document.getElementById("team-top");
      try {
        const teams = await api("/users/teams", {});
        if (!teams.length) {
          select.innerHTML = '<option>Команд пока нет</option>';
          return;
        }
        select.innerHTML = teams.map((t) => `<option value="${t.id}">${t.name}</option>`).join("");
        select.onchange = () => loadTeamTop(select.value);
        loadTeamTop(select.value);
      } catch (err) {
        select.innerHTML = '<option>Недоступно</option>';
        teamTop.innerHTML = `<div class="error">${err.message}</div>`;
      }
    }

    async function loadTeamTop(teamId) {
      const container = document.getElementById("team-top");
      container.innerHTML = '<div class="empty">Загрузка…</div>';
      try {
        const entries = await api("/stats/top/team", {
          period_start: periodStart,
          period_end: periodEnd,
          team_id: teamId,
        });
        renderTop(container, entries);
      } catch (err) {
        container.innerHTML = `<div class="error">${err.message}</div>`;
      }
    }

    async function init() {
      try {
        const me = await api("/users/me", {});
        document.getElementById("greeting").textContent = `Привет, ${me.full_name}`;
      } catch (err) {
        document.getElementById("greeting").textContent = "CRM Dashboard";
      }
      await loadCompanyTop();
      await loadTeams();
    }

    init();
  </script>
</body>
</html>
