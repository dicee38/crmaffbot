[project]
name = "shared"
version = "0.1.0"
description = "Shared ORM models, enums and API schemas for the CRM bot"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
